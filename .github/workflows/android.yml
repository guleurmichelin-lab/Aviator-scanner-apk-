name: build aviator scanner apk  

on: Workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: gradle/action/setup-gradle@v4

    - name: Upload apk
      run: action/upload-artifact@v4
    - name: aviator scanner-apk 
      run: app/build/outputs/apk/debug/*.apk
